version: 2
updates:
  # Go module dependencies — keeps direct deps current and surfaces security
  # fixes (e.g. go-jose, golang.org/x/net) as PRs.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # GitHub Actions used in workflows — keeps checkout/setup-go/goreleaser pinned
  # versions up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

name: CI

# Runs the PR checklist automatically so build/test/vet are enforced,
# not trusted. Triggers on pull requests only.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test ./...

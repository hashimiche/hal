name: CI

# Runs the checklist automatically so build/test/vet are enforced, not trusted.
# Triggers on every branch push (not tags — release.yml owns v* tags) so a
# contributor sees failures on their own branch before opening a PR.
on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  check:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test ./...

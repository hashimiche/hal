load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events {}
http {
  access_log off;
  js_import lab from /app/evidence.js;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8443 ssl;
    ssl_protocols TLSv1.3;
    ssl_certificate /identity/tls.crt;
    ssl_certificate_key /identity/tls.key;
    ssl_client_certificate /trust/root.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_conf_command Groups MLKEM768;
    ssl_conf_command SignatureAlgorithms mldsa65;
    ssl_session_cache off;
    ssl_session_tickets off;
    keepalive_timeout 0;
    location / { js_content lab.backend; }
  }
}

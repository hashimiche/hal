load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events {}
http {
  access_log off;
  js_import lab from /app/evidence.js;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8443 ssl;
    ssl_certificate /browser/tls.crt;
    ssl_certificate_key /browser/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_conf_command Groups X25519:P-256;
    ssl_conf_command SignatureAlgorithms ecdsa_secp256r1_sha256:rsa_pss_rsae_sha256;
    set $pqc_backend_dns backend.hal-pqc.svc.__CLUSTER_DOMAIN__;
    root /app;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    location = / { try_files /index.html =404; }
    location = /test { js_content lab.test; }
    location = /_backend {
      internal;
      proxy_pass https://backend.hal-pqc.svc.__CLUSTER_DOMAIN__:8443/;
      proxy_ssl_certificate /identity/tls.crt;
      proxy_ssl_certificate_key /identity/tls.key;
      proxy_ssl_trusted_certificate /trust/root.pem;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_server_name on;
      proxy_ssl_name backend.hal-pqc.svc.__CLUSTER_DOMAIN__;
      proxy_ssl_protocols TLSv1.3;
      proxy_ssl_conf_command Groups MLKEM768;
      proxy_ssl_conf_command SignatureAlgorithms mldsa65;
      proxy_ssl_session_reuse off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
      proxy_pass_request_headers off;
      proxy_set_header Host backend;
    }
    location / { return 404; }
  }
}
